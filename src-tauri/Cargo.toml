[package]
name = "pr-desk"
publish = false # Internal crate; the application version comes from package.json.
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }
