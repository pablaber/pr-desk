name: Tests

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Test Homebrew release automation
        run: node --test scripts/update-homebrew.test.mjs

      - name: Build frontend
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e -- --forbid-only --workers=1 --reporter=line,html --trace=retain-on-failure

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  rust:
    name: Rust checks and tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
