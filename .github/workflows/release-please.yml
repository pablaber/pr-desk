name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release-please:
    name: Create or update the release PR
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release.outputs.id }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Build Apple Silicon release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      version: ${{ steps.homebrew.outputs.version }}
      sha256: ${{ steps.homebrew.outputs.sha256 }}
    permissions:
      contents: write
    steps:
      - name: Check out released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned Rust toolchain and target
        run: rustup target add aarch64-apple-darwin
      - name: Stage the App Store Connect notarization key
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then
              echo "Missing repository secret $name; see README \"Apple signing credentials\"." >&2
              exit 1
            fi
          done
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo 'Missing repository variable APPLE_SIGNING_IDENTITY.' >&2
            exit 1
          fi
          # notarytool needs the key on disk; keep it out of the workspace and the built bundle.
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          if ! grep -q 'BEGIN PRIVATE KEY' "$key_path"; then
            echo 'APPLE_API_KEY_BASE64 does not decode to an App Store Connect .p8 key.' >&2
            exit 1
          fi
          echo "api_key_path=$key_path" >> "$GITHUB_OUTPUT"
      - name: Install Apple's Developer ID G2 intermediate certificate
        run: |
          # Keychain Access does not bundle the issuing chain into an exported .p12,
          # and codesign only warns when it cannot build a chain to a trusted root:
          # it then embeds an incomplete chain that Apple's notary service rejects.
          cer="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$cer"
          if ! openssl x509 -inform DER -in "$cer" -noout -subject | grep -q 'OU *= *G2'; then
            echo 'Downloaded certificate is not the Developer ID G2 intermediate.' >&2
            exit 1
          fi
          # A duplicate import is not an error; the post-build checks catch a broken chain.
          security import "$cer" || echo 'Intermediate already present in the default keychain.'
      - name: Build, sign, notarize and attach macOS bundles to the existing release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.api_key_path }}
        with:
          releaseId: ${{ needs.release-please.outputs.release_id }}
          args: --target aarch64-apple-darwin --bundles app,dmg --verbose
          retryAttempts: 1
          includeUpdaterJson: false
      - name: Notarize the DMG and verify Gatekeeper acceptance
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.api_key_path }}
        run: ./scripts/notarize-macos.sh src-tauri/target/aarch64-apple-darwin/release/bundle
      - name: Replace the uploaded DMG with the stapled one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            --repo pablaber/pr-desk --clobber
      - name: Verify published DMG and calculate Homebrew metadata
        id: homebrew
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
        run: |
          gh api "repos/pablaber/pr-desk/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          node scripts/update-homebrew.mjs metadata "$RUNNER_TEMP/release.json" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg >> "$GITHUB_OUTPUT"
      - name: Remove the staged notarization key
        if: always() && steps.apple.outputs.api_key_path != ''
        run: rm -f "${{ steps.apple.outputs.api_key_path }}"

  update-homebrew:
    name: Update Homebrew tap
    needs: [release-please, release]
    if: needs.release-please.outputs.release_created == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Create token scoped to the Homebrew tap
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: pablaber
          repositories: |
            homebrew-tap
          permission-contents: write
      - name: Check out tap default branch
        uses: actions/checkout@v6
        with:
          repository: pablaber/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap
      - name: Update and validate cask
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          DMG_SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          node scripts/update-homebrew.mjs update homebrew-tap/Casks/pr-desk.rb "$RELEASE_VERSION" "$DMG_SHA256"
          ruby -c homebrew-tap/Casks/pr-desk.rb
      - name: Commit and push only if changed
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if git diff --quiet -- Casks/pr-desk.rb; then
            echo "Homebrew already contains $RELEASE_VERSION; nothing to commit."
            exit 0
          fi
          bot_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -- Casks/pr-desk.rb
          git commit -m "chore: update pr-desk to $RELEASE_VERSION"
          git push origin HEAD
